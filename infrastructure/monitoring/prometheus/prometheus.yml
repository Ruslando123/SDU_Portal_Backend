global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9090]
    basic_auth:
      username: metrics
      password_file: /run/secrets/metrics-password
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
