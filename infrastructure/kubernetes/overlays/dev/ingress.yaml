apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdu-backend
spec:
  ingressClassName: traefik
  tls:
    - hosts: [sdu-dev.test]
      secretName: sdu-test-tls
  rules:
    - host: sdu-dev.test
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: sdu-backend
                port:
                  name: http
