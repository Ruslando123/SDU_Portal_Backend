[databases]
portal_cloud_smoke = host=127.0.0.1 port=5432 dbname=portal_cloud_smoke

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /tmp/sdu-cloud/pgbouncer/users
stats_users = pgbouncer_stats
max_client_conn = 24
default_pool_size = 16
max_db_connections = 16
reserve_pool_size = 0
pool_mode = @POOL_MODE@
max_prepared_statements = 128
server_reset_query = DISCARD ALL
server_connect_timeout = 5
server_login_retry = 1
query_wait_timeout = 15
idle_transaction_timeout = 15
server_idle_timeout = 600
stats_period = 5
log_connections = 0
log_disconnections = 0
log_stats = 0
