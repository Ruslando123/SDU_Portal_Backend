global
    maxconn 160
    nbthread 1
    hard-stop-after 12s

defaults
    mode http
    timeout connect 2s
    timeout client 22s
    timeout server 20s
    timeout http-request 5s
    timeout queue 3s
    timeout check 2s
    retries 0

frontend portal
    bind 127.0.0.1:8081
    default_backend portal_instances

backend portal_instances
    balance roundrobin
    option http-server-close
    option httpchk
    http-check send meth GET uri /actuator/health/readiness ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-response set-header X-SDU-Backend-Instance %[srv_name]
